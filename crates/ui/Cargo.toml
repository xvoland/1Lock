[package]
name = "opclient-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Front end of the 1Password export client (iced)"

[dependencies]
opclient-core.workspace = true
iced = { version = "0.14", default-features = false, features = ["smol", "wgpu", "tiny-skia", "crisp", "web-colors", "image", "svg"] }
iced_wgpu = "0.14"
iced_winit = "0.14"
iced_futures = "0.14"
rfd = { version = "0.15", default-features = false }
async-channel = "2"
muda = "0.19.3"
# Clipboard. Cross-platform, but it used to sit behind macOS, so copying
# silently did nothing on Windows.
arboard = "3"

[target.'cfg(target_os = "macos")'.dependencies]

[build-dependencies]
# Icon and version inside the .exe on Windows. Cross-platform, but it only
# builds resources under windows, hence a build dependency rather than a
# runtime one.
winresource = "0.1"

[[bin]]
name = "opclient-ui"
path = "src/main.rs"
