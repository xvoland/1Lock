[package]
name = "opclient-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Чтение формата 1Password Agile Keychain (.1p4) без модификации исходных данных"

[dependencies]
# SQLite-чтение. bundled — чтобы не тянуть системную либлиотеку,
# это важно для кросс-сборки под Windows.
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }

[dev-dependencies]
tempfile = "3"