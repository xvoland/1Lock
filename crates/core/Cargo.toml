[package]
name = "opclient-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Read the 1Password Agile Keychain format (.1p4) without modifying the source data"

[dependencies]
# SQLite reading. bundled — so we don't pull in a system library,
# which matters for cross-compilation on Windows.
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
# System randomness for new uuids. Wraps /dev/urandom on Unix and
# BCryptGenRandom on Windows; reading /dev/urandom by hand only worked on the
# first of the two.
getrandom = "0.4"
serde_json = "1"
thiserror = "1"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }

[dev-dependencies]
tempfile = "3"