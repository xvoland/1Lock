name: build

# The build runs on push: without a commit in the remote there is nothing to run.
on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# The built-in token needs this to create a release and attach artifacts to
# it. It is off by default, and without it the release job fails on the very
# step everything else was built for.
permissions:
  contents: write

# A new push cancels an unfinished run: otherwise every commit piles up several
# heavy wgpu builds.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          # Without tags `git describe` returns nothing and the version falls
          # back to 1.0.0 from Cargo.toml. A truncated history breaks both the
          # build and the version check in the artifacts.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: cargo test --release
      - name: Clippy
        run: cargo clippy --release --all-targets -- -D warnings

  macos:
    name: .app bundle
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release -p opclient-ui
      - name: Bundle
        run: ./scripts/make-bundle.sh
      # The version in Info.plist and the version shown by the "About" window
      # are read from the very same tag. A mismatch would mean one of the two
      # was built from a stale binary.
      #
      # On master the app is one commit past the last tag and says so with
      # -dev, so the bare tag is accepted here and the exact match is left to
      # the release job, which only ever runs on the tagged commit.
      - name: Version check
        run: |
          bundle=$(plutil -extract CFBundleShortVersionString raw dist/1Lock.app/Contents/Info.plist)
          tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*' | sed 's/^v//')
          echo "bundle: $bundle, tag: $tag"
          case "$bundle" in
            "$tag"|"$tag-dev") ;;
            *) echo "version does not match the tag"; exit 1 ;;
          esac
      # A disk image holding the app and a link to /Applications, so it installs
      # by dragging, the way people expect. No extra tooling: hdiutil and
      # diskutil ship with macOS, and create-dmg is overkill for two files.
      #
      # The raw .app is not published as an artifact of its own: the image
      # already contains it, and a second download only gives people a second
      # way to install it wrong.
      - name: Disk image
        run: |
          stage="$RUNNER_TEMP/dmg"
          rm -rf "$stage"
          mkdir -p "$stage"
          # ditto, not cp -R: this is the supported way to copy a bundle. The
          # bundle carries Contents/_CodeSignature and extended attributes, and
          # a plain copy can drop them — after which the signature no longer
          # verifies.
          ditto dist/1Lock.app "$stage/1Lock.app"
          # A symlink, not a real folder: a folder opens just as well, but
          # Finder only shows the "drag here to install" hint for a link.
          ln -s /Applications "$stage/Applications"
          # diskutil, not hdiutil create: the latter's -volnum and -format form
          # is deprecated and prints a warning into the log.
          diskutil image create from "$stage" -volumeName 1Lock -format UDZO 1Lock-macos.dmg
      # The image has to be mounted and looked inside: an image that builds but
      # comes out empty looks exactly like a working one in the log. The
      # signature is checked too — if packing damaged it, Finder refuses to
      # launch the app and the user is the one left debugging.
      - name: Verify disk image
        run: |
          mount="$RUNNER_TEMP/mnt"
          rm -rf "$mount"
          mkdir -p "$mount"
          hdiutil attach 1Lock-macos.dmg -nobrowse -readonly -mountpoint "$mount"
          trap 'hdiutil detach "$mount" || true' EXIT
          test -d "$mount/1Lock.app"
          test -x "$mount/1Lock.app/Contents/MacOS/1Lock"
          test -L "$mount/Applications"
          echo "Applications -> $(readlink "$mount/Applications")"
          codesign -v "$mount/1Lock.app"
          ls -la "$mount"
      - uses: actions/upload-artifact@v4
        with:
          name: 1Lock-macos-dmg
          path: 1Lock-macos.dmg

  windows:
    name: .exe build
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The name is taken from APP_TITLE rather than from the crate: an exe
      # called `opclient-ui` looks like someone else's builder in Task Manager.
      # This name is also already written into the resources as OriginalFilename.
      - name: App name
        shell: pwsh
        run: |
          $m = Select-String -Path crates/ui/src/main.rs -Pattern 'const APP_TITLE: &str = "(.*)";'
          "APP_NAME=$($m.Matches.Groups[1].Value)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build
        run: cargo build --release -p opclient-ui
      - name: Rename
        shell: pwsh
        run: Copy-Item target/release/opclient-ui.exe "$env:APP_NAME.exe"
      # We check not only the version but also that the resources actually got
      # embedded: build.rs exits early and silently when the target is not
      # Windows, and without this check CI would ship an .exe with no icon and a
      # zeroed FileDescription.
      - name: Resource check
        shell: pwsh
        run: |
          $info = (Get-Item "$env:APP_NAME.exe").VersionInfo
          $tag = (git describe --tags --abbrev=0 --match 'v[0-9]*') -replace '^v', ''
          "exe: '$($info.FileVersion)', description: '$($info.FileDescription)', tag: $tag"
          if (-not $info.FileDescription) { throw "resources were not embedded" }
          if (-not $info.FileVersion.StartsWith($tag)) { throw "versions do not match" }
      - name: Archive
        shell: pwsh
        run: tar -czf 1Lock-windows.tar.gz "$env:APP_NAME.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: 1Lock-windows
          path: 1Lock-windows.tar.gz

  # Runs on a tag push only. The artifacts of a plain master run expire after
  # 90 days, and a tag alone does not make a release page: without this job
  # the Releases tab stays empty and the only copy of every binary disappears
  # three months later.
  release:
    name: release
    needs: [macos, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
      - name: List what is being published
        run: find files -type f -exec ls -la {} \;
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          dmg="files/1Lock-macos-dmg/1Lock-macos.dmg"
          win="files/1Lock-windows/1Lock-windows.tar.gz"
          test -f "$dmg" || { echo "no dmg in artifacts"; exit 1; }
          test -f "$win" || { echo "no windows archive in artifacts"; exit 1; }

          # A re-run of a tag must not fail on "release already exists": that
          # is the normal way to retry a failed publish. Assets are replaced
          # rather than added twice.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag exists, replacing assets"
            gh release upload "$tag" "$dmg" "$win" --clobber
          else
            gh release create "$tag" \
              --title "1Lock ${tag#v}" \
              --generate-notes \
              --verify-tag \
              "$dmg#1Lock-macos.dmg" \
              "$win#1Lock-windows.tar.gz"
          fi
          gh release view "$tag" --json tagName,url,assets \
            --jq '{tag: .tagName, url: .url, assets: [.assets[].name]}'
